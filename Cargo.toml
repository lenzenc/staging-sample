[package]
name = "liabilities"
version = "0.1.0"
edition = "2024"
default-run = "liabilities"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bson = { version = "3.1.0", features = ["chrono-0_4"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env"] }
futures-util = "0.3.34"
garde = { version = "0.23.0", features = ["derive", "regex"] }
indexmap = { version = "2.14.2", features = ["serde"] }
mongodb = { version = "3.10.2", default-features = false, features = ["bson-3", "compat-3-3-0", "rustls-tls", "dns-resolver"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["chrono", "decimal"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }

[dev-dependencies]
axum-test = "21.1.0"
testcontainers-modules = { version = "0.15.0", features = ["mongo"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
