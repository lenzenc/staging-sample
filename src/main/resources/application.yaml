spring:
  application:
    name: client-liabilities-api
  # Optional .env in the working directory (APP_ENV, MONGODB_URI, MONGODB_DB), as before.
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: ${MONGODB_DB:liabilities}
  data:
    mongodb:
      auto-index-creation: true
      field-naming-strategy: org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true # harness edits show up without a hard refresh
  docker:
    compose:
      lifecycle-management: start-only

server:
  port: 8000

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /openapi.json
